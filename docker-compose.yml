version: '3.8'

services:
  backend:
    build: ./backend
    container_name: legal_contract_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Legal Contract Analysis Engine
      - APP_ENV=production
      - DEBUG=False
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://legal_user:legal_pass@postgres:5432/legal_contracts_db
      - CHROMA_PERSIST_DIRECTORY=/app/storage/chroma_db
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: legal_contract_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: legal_contract_postgres
    restart: always
    environment:
      POSTGRES_USER: legal_user
      POSTGRES_PASSWORD: legal_pass
      POSTGRES_DB: legal_contracts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_user -d legal_contracts_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
